# ---------------------------------------------------------------
# 1) HTTP :80 (container 8080) -> chuyển hướng sang HTTPS
# ---------------------------------------------------------------
server {
    listen 8080;
    server_name _;
    return 301 https://$host$request_uri;
}

# ---------------------------------------------------------------
# 2) HTTPS :443 (container 8443) -> WordPress (php-fpm)
# ---------------------------------------------------------------
server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/conf.d/security-headers.inc;

    root  /var/www/html;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Giới hạn tần suất đăng nhập
    location = /wp-login.php {
        limit_req zone=login burst=5 nodelay;
        include /etc/nginx/conf.d/security-headers.inc;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_pass wordpress:9000;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;               # WordPress biết đang ở sau HTTPS
        fastcgi_pass wordpress:9000;
        fastcgi_read_timeout 60s;
    }

    # Chặn các file/endpoint nhạy cảm
    location = /xmlrpc.php          { deny all; }
    location ~ /\.(?!well-known)    { deny all; }
    location ~* /(?:uploads|files)/.*\.php$ { deny all; }
    location = /wp-config.php       { deny all; }

    location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|svg|woff2?)$ {
        expires 7d;
        access_log off;
        include /etc/nginx/conf.d/security-headers.inc;
    }
}

# ---------------------------------------------------------------
# 3) HTTPS :9443 -> phpMyAdmin (có Basic Auth, không publish trực tiếp)
# ---------------------------------------------------------------
server {
    listen 9443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    include /etc/nginx/conf.d/security-headers.inc;

    auth_basic           "Khu vuc quan tri - phpMyAdmin";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass http://phpmyadmin:80;
        proxy_set_header Host              $host:$server_port;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
