worker_processes auto;
pid /tmp/nginx.pid;                       # non-root: không ghi vào /var/run
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Thư mục tạm cho user non-root
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Log dạng key=value để Loki/LogQL dùng `| logfmt`
    log_format logfmt 'remote_addr=$remote_addr method=$request_method '
                      'uri="$request_uri" status=$status bytes=$body_bytes_sent '
                      'rt=$request_time host=$host ua="$http_user_agent"';
    access_log /dev/stdout logfmt;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;                    # ẩn phiên bản Nginx
    client_max_body_size 16m;

    # Chống brute-force trang đăng nhập
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

    include /etc/nginx/conf.d/*.conf;
}
