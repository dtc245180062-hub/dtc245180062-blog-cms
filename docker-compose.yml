# Đề 7 - Hệ thống Blog/CMS: WordPress + MySQL + phpMyAdmin + Nginx
# Triển khai bằng Docker Compose.

name: blogcms

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

services:
  # ---------------------------------------------------------------- MySQL
  db:
    image: mysql:8.0
    <<: *hardening
    container_name: blogcms-db
    command:
      - --skip-name-resolve
      - --local-infile=0
      - --max-connections=100
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${WP_DB_NAME}
      MYSQL_USER: ${WP_DB_USER}        # user riêng, chỉ có quyền trên DB wordpress
      MYSQL_PASSWORD: ${WP_DB_PASSWORD}
      EXPORTER_DB_PASSWORD: ${EXPORTER_DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro   # tạo user giám sát quyền tối thiểu
    networks: [database]               # mạng internal, không ra Internet, không publish port
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ------------------------------------------------------------ WordPress
  wordpress:
    image: wordpress:6-php8.3-fpm-alpine
    <<: *hardening
    container_name: blogcms-wordpress
    user: "82:82"                      # www-data (alpine) -> chạy NON-ROOT
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${WP_DB_NAME}
      WORDPRESS_DB_USER: ${WP_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WP_DB_PASSWORD}
      WORDPRESS_CONFIG_EXTRA: |
        define('DISALLOW_FILE_EDIT', true);
        define('FORCE_SSL_ADMIN', true);
    volumes:
      - wp_data:/var/www/html
    networks: [frontend, database]
    cap_drop: [ALL]

  # ---------------------------------------------------------- phpMyAdmin
  phpmyadmin:
    image: phpmyadmin:5.2-apache
    <<: *hardening
    container_name: blogcms-phpmyadmin
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_ARBITRARY: 0
      UPLOAD_LIMIT: 16M
    networks: [frontend, database]     # KHÔNG publish port, chỉ vào qua Nginx + basic auth

  # ---------------------------------------------------------------- Nginx
  nginx:
    image: nginxinc/nginx-unprivileged:1.27-alpine   # non-root (uid 101)
    <<: *hardening
    container_name: blogcms-nginx
    depends_on: [wordpress, phpmyadmin]
    ports:
      - "80:8080"       # HTTP  -> redirect sang HTTPS
      - "443:8443"      # HTTPS -> WordPress
      - "9443:9443"     # HTTPS -> phpMyAdmin (basic auth)
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      - wp_data:/var/www/html:ro        # phục vụ file tĩnh của WordPress
    networks: [frontend, monitoring]
    cap_drop: [ALL]

  # ============================ GIÁM SÁT (Commit 2) ============================
  prometheus:
    image: prom/prometheus:v2.55.1
    <<: *hardening
    container_name: blogcms-prometheus
    user: "65534:65534"                # nobody
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"          # chỉ truy cập từ chính máy chủ
    networks: [monitoring, frontend]
    cap_drop: [ALL]

  grafana:
    image: grafana/grafana:11.3.0
    <<: *hardening
    container_name: blogcms-grafana
    user: "472:472"
    depends_on: [prometheus, loki]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    networks: [monitoring, frontend]
    cap_drop: [ALL]

  cadvisor:                            # metrics của từng container
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    <<: *hardening
    container_name: blogcms-cadvisor
    command: ["--docker_only=true", "--housekeeping_interval=15s"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    devices:
      - /dev/kmsg
    privileged: true                   # cAdvisor bắt buộc cần đọc cgroup/host (ngoại lệ có chủ đích)
    networks: [monitoring]

  node-exporter:                       # metrics máy chủ (CPU/RAM/disk)
    image: prom/node-exporter:v1.8.2
    <<: *hardening
    container_name: blogcms-node-exporter
    user: "65534:65534"
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave
    networks: [monitoring]
    cap_drop: [ALL]

  nginx-exporter:                      # metrics web server (đọc stub_status)
    image: nginx/nginx-prometheus-exporter:1.3.0
    <<: *hardening
    container_name: blogcms-nginx-exporter
    command:
      - --nginx.scrape-uri=http://nginx:8081/stub_status
    depends_on: [nginx]
    networks: [monitoring]
    cap_drop: [ALL]

  mysqld-exporter:                     # metrics database
    image: prom/mysqld-exporter:v0.16.0
    <<: *hardening
    container_name: blogcms-mysqld-exporter
    user: "65534:65534"
    command:
      - --mysqld.address=db:3306
      - --mysqld.username=exporter
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${EXPORTER_DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks: [monitoring, database]
    cap_drop: [ALL]

  # ============================ LOG TẬP TRUNG (Commit 3) ============================
  loki:
    image: grafana/loki:3.2.0
    <<: *hardening
    container_name: blogcms-loki
    user: "10001:10001"
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    networks: [monitoring]             # không publish port; truy vấn qua Grafana
    cap_drop: [ALL]

  promtail:
    image: grafana/promtail:3.2.0
    <<: *hardening
    container_name: blogcms-promtail
    command: ["-config.file=/etc/promtail/promtail-config.yml"]
    depends_on: [loki]
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro   # cần để đọc log container (ngoại lệ: chạy root, mount read-only)
    networks: [monitoring]
networks:
  frontend:
    driver: bridge
  database:
    driver: bridge
    internal: true      # network isolation: DB không thể ra/vào từ ngoài
  monitoring:
    driver: bridge
    internal: true      # các exporter/Prometheus nói chuyện với nhau, không ra Internet

volumes:
  db_data:
  wp_data:
  prometheus_data:
  grafana_data:
  loki_data:
